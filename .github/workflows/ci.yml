name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_aws:
        description: 'Deploy to AWS EKS'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: "3.11"

jobs:
  # Test and Code Quality
  test:
    name: Test & Code Quality
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e "exporter/[dev]"
        pip install pytest-cov pip-audit bandit
        
    - name: Code formatting check
      run: black --check .
      
    - name: Linting
      run: ruff check .
      
    - name: Type checking
      run: mypy exporter/ --ignore-missing-imports
      
    - name: Security scanning
      run: |
        pip-audit -r requirements.txt
        bandit -r exporter/ -f json -o bandit-report.json || true
        
    - name: Run tests with coverage
      run: |
        pytest test/ -v --cov=scraper --cov-report=xml --cov-report=html
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # Build Docker Image
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Resolve image name
      id: image
      run: |
        if [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
          echo "name=${{ secrets.DOCKER_USERNAME }}/powerscale-exporter" >> "$GITHUB_OUTPUT"
        else
          # PR validation builds don't push; a local name is enough and
          # keeps them working when the Docker Hub secrets aren't set
          echo "name=pscale-exporter" >> "$GITHUB_OUTPUT"
        fi

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.image.outputs.name }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=ref,event=tag
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Resolve mock image name
      id: mock-image
      run: |
        if [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
          echo "name=${{ secrets.DOCKER_USERNAME }}/powerscale-mock-onefs" >> "$GITHUB_OUTPUT"
        else
          # PR validation builds don't push; a local name is enough and
          # keeps them working when the Docker Hub secrets aren't set
          echo "name=pscale-mock-onefs" >> "$GITHUB_OUTPUT"
        fi

    - name: Extract mock metadata
      id: mock-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.mock-image.outputs.name }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=ref,event=tag
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push mock image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./mock_onefs/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.mock-meta.outputs.tags }}
        labels: ${{ steps.mock-meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Deploy to AWS EKS (Manual Trigger)
  deploy-aws:
    name: Deploy to AWS EKS
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event.inputs.deploy_aws == 'true'
    environment: production
    # secrets context is not available in `if:` expressions -- map to env first
    env:
      AWS_LOAD_BALANCER: ${{ secrets.AWS_LOAD_BALANCER }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
        
    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}
        
    - name: Deploy to EKS
      run: |
        # Create namespace if not exists
        kubectl create namespace powerscale-monitoring --dry-run=client -o yaml | kubectl apply -f -
        
        # Apply Kubernetes manifests
        kubectl apply -f k8s/ -n powerscale-monitoring
        
        # Configure secrets
        kubectl create secret generic powerscale-exporter-secrets \
          --from-literal=ISILON_USER=root \
          --from-literal=ISILON_PASS="${{ secrets.POWERSCALE_PASSWORD }}" \
          --namespace=powerscale-monitoring \
          --dry-run=client -o yaml | kubectl apply -f -
          
        # Restart deployment
        kubectl rollout restart deployment/powerscale-exporter -n powerscale-monitoring
        
    - name: Verify deployment
      run: |
        # Wait for pods to be ready
        kubectl wait --for=condition=ready pod \
          -l app=powerscale-exporter -n powerscale-monitoring --timeout=300s
          
        # Show deployment status
        kubectl get all -n powerscale-monitoring
        
        # Show logs
        kubectl logs -l app=powerscale-exporter -n powerscale-monitoring --tail=20
        
    - name: Test endpoints
      run: |
        # Port forward and test
        kubectl port-forward -n powerscale-monitoring svc/powerscale-exporter-service 8000:8000 &
        PORT_FORWARD_PID=$!
        
        # Wait for port forward
        sleep 10
        
        # Test health endpoint
        curl -f http://localhost:8000/healthz || exit 1
        
        # Test metrics endpoint
        curl -f http://localhost:8000/metrics/ || exit 1
        
        # Clean up port forward
        kill $PORT_FORWARD_PID
        
    - name: Setup Ingress (Optional)
      if: env.AWS_LOAD_BALANCER != ''
      run: |
        # Create Ingress for external access
        cat << EOF | kubectl apply -f -
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: powerscale-exporter-ingress
          namespace: powerscale-monitoring
          annotations:
            kubernetes.io/ingress.class: alb
            alb.ingress.kubernetes.io/scheme: internet-facing
        spec:
          rules:
          - host: powerscale.${{ secrets.AWS_DOMAIN }}
            http:
              paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: powerscale-exporter-service
                    port:
                      number: 8000
        EOF
        
        echo "Ingress created. Access via: http://powerscale.${{ secrets.AWS_DOMAIN }}"

  # End-to-end demo smoke test (mock OneFS + exporter via compose)
  e2e:
    name: E2E demo smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot demo stack
        run: docker compose -f docker-compose.demo.yml up --build -d
      - name: Wait for exporter healthy
        run: |
          for i in $(seq 1 36); do
            if curl -sf http://localhost:8000/healthz | grep -q '"status":"online"'; then echo "exporter online"; break; fi
            sleep 5
          done
          curl -sf http://localhost:8000/healthz | grep -q '"status":"online"'
      - name: Assert key metrics present
        run: |
          for i in $(seq 1 36); do
            curl -sf http://localhost:8000/metrics/ -o /tmp/metrics.txt
            ok=1
            for m in isilon_cluster_health isilon_node_status isilon_drive_health isilon_cluster_capacity_bytes_total isilon_snapshot_count isilon_cluster_event_info isilon_node_version_info isilon_storagepool_bytes_total isilon_dedupe_saved_bytes isilon_node_temp_celsius; do
              grep -q "^$m" /tmp/metrics.txt || ok=0
            done
            if [ "$ok" = "1" ]; then echo "all series present"; break; fi
            sleep 5
          done
          [ "$ok" = "1" ]
      - name: Failure injection round-trip
        run: |
          curl -sfk -X POST https://localhost:8443/platform/1/faults -H 'Content-Type: application/json' -d '{"scenario":"drive-failure"}'
          sleep 45
          curl -sf http://localhost:8000/metrics/ | grep -E 'isilon_drive_health\{[^}]*drive_id="1"[^}]*\} 0(\.0)?$' && echo "fault observed"
          curl -sfk -X POST https://localhost:8443/platform/1/faults -H 'Content-Type: application/json' -d '{"scenario":"clear"}'
      - name: Validate Prometheus configs
        run: python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('monitoring/prometheus/*.yml')]; print('prometheus configs valid')"
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.demo.yml down -v
