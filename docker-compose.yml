services:
  isilon-tunnel:
    image: docker.io/alpine:3.20
    container_name: isilon-tunnel
    restart: unless-stopped
    environment:
      MGMT_IP: ${MGMT_IP:?Set MGMT_IP to the OneFS management IP}
      MGMT_PORT: ${MGMT_PORT:-8080}
      JUMPHOST: ${JUMPHOST:?Set JUMPHOST to the SSH jump host}
      JUMPPORT: ${JUMPPORT:-22}
      SSH_KEY: "/root/.ssh/id_ed25519"
    command:
      - sh
      - -ec
      - |
          apk add --no-cache openssh busybox-extras
          ls -l /root/.ssh
          exec ssh -N \
            -L 0.0.0.0:8080:${MGMT_IP}:${MGMT_PORT} \
            -p ${JUMPPORT} \
            -i ${SSH_KEY} \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=3 \
            root@${JUMPHOST}
    volumes:
      - type: bind
        source: ${SSH_KEY_DIR:?Set SSH_KEY_DIR, e.g. $HOME/.ssh}
        target: /root/.ssh
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'nc -z -w 1 127.0.0.1 8080'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  isilon-exporter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isilon-exporter
    restart: unless-stopped
    depends_on:
      isilon-tunnel:
        condition: service_healthy
    environment:
      - ISILON_HOST=isilon-tunnel
      - ISILON_PORT=8080
      - ISILON_USER=${ISILON_USER:-root}
      - ISILON_PASS=${ISILON_PASS:?Set ISILON_PASS}
      - SCRAPE_INTERVAL=${SCRAPE_INTERVAL:-30}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "19091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'

  alertmanager:
    image: docker.io/prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "19093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "13001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
