{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "powerscale-exporter.fullname" . }}-netpol
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "powerscale-exporter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "powerscale-exporter.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow metrics scraping from Prometheus
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8000
  # Allow health checks from anywhere in the same namespace
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8000
  # Allow access from ingress controllers
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Allow PowerScale API access
  - to:
    {{- range .Values.networkPolicy.egressCidrs }}
    - ipBlock:
        cidr: {{ . }}
    {{- end }}
    ports:
    - protocol: TCP
      port: 8080
  # Allow HTTPS for external API calls
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow HTTP for package downloads (if needed)
  - to: []
    ports:
    - protocol: TCP
      port: 80
{{- end }}
