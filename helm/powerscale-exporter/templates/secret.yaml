{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "powerscale-exporter.secretName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "powerscale-exporter.labels" . | nindent 4 }}
  {{- if .Values.mock.enabled }}
  annotations:
    description: "DEMO credentials for the mock OneFS cluster (accepts any user/pass)."
  {{- end }}
type: Opaque
stringData:
  ISILON_USER: {{ .Values.auth.user | quote }}
  ISILON_PASS: {{ .Values.auth.password | quote }}
{{- end }}
