{{- if .Values.service.nodePort.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "powerscale-exporter.fullname" . }}-nodeport
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "powerscale-exporter.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.serviceAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    description: "NodePort service for external access from host"
spec:
  type: NodePort
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    nodePort: {{ .Values.service.nodePort.port }}
    protocol: TCP
  selector:
    {{- include "powerscale-exporter.selectorLabels" . | nindent 4 }}
{{- end }}
