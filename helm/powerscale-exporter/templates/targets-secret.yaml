{{- if .Values.clusters }}
{{- $targets := list }}
{{- range .Values.clusters }}
{{- $pw := index $.Values.clusterPasswords .name }}
{{- if not $pw }}
{{- fail (printf "powerscale-exporter: cluster %q has no password set (set clusterPasswords.%s)" .name .name) }}
{{- end }}
{{- $targets = append $targets (dict "name" .name "host" .host "port" (.port | default 8080) "user" (.user | default "root") "password" $pw) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "powerscale-exporter.fullname" . }}-targets
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "powerscale-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  targets.json: {{ $targets | toJson | quote }}
{{- end }}
