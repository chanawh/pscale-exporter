apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Demo overlay: exporter scraping the mock OneFS cluster in-cluster.
# Apply with: kubectl apply -k k8s/demo/

resources:
  # Base manifests, referenced as a directory (kubectl's kustomize blocks
  # direct '../' file references, so the base must be a kustomization).
  - ../manifests
  - mock-onefs.yaml
  - demo-secret.yaml

patches:
  # Point the exporter at the in-cluster mock instead of a real cluster.
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: powerscale-exporter-config
