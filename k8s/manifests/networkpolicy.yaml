apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: powerscale-exporter-netpol
  namespace: powerscale-monitoring
  labels:
    app: powerscale-exporter
    component: security
    version: v0.1.0
spec:
  podSelector:
    matchLabels:
      app: powerscale-exporter
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow metrics scraping from Prometheus
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8000
  # Allow health checks from anywhere in the same namespace
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8000
  # Allow access from ingress controllers
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Allow PowerScale API access (adjust to your network)
  - to:
    - ipBlock:
        cidr: 192.168.0.0/16
    - ipBlock:
        cidr: 10.0.0.0/8
    - ipBlock:
        cidr: 172.16.0.0/12
    ports:
    - protocol: TCP
      port: 8080
  # Allow HTTPS for external API calls
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow HTTP for package downloads (if needed)
  - to: []
    ports:
    - protocol: TCP
      port: 80
