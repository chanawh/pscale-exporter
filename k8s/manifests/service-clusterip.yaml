apiVersion: v1
kind: Service
metadata:
  name: powerscale-exporter-clusterip
  namespace: powerscale-monitoring
  labels:
    app: powerscale-exporter
    component: service-clusterip
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics/"
    description: "ClusterIP service for internal Prometheus scraping"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  selector:
    app: powerscale-exporter
