apiVersion: v1
kind: Service
metadata:
  name: powerscale-exporter-nodeport
  namespace: powerscale-monitoring
  labels:
    app: powerscale-exporter
    component: service-nodeport
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics/"
    description: "NodePort service for external access from host"
spec:
  type: NodePort
  ports:
  - name: http
    port: 8000
    targetPort: 8000  # PowerScale exporter uses port 8000
    nodePort: 30080  # Fixed port for host access
    protocol: TCP
  selector:
    app: powerscale-exporter
