# Production-Ready Alertmanager Configuration
# PowerScale Monitoring Stack - Portfolio Version

global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@powerscale.local'
  slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'

route:
  group_by: ['alertname', 'cluster_name', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default-alerts'
  
  routes:
  - match:
      severity: critical
    receiver: 'critical-alerts'
    group_wait: 10s
    repeat_interval: 30m
    
  - match:
      severity: warning
    receiver: 'warning-alerts'
    group_wait: 2m
    repeat_interval: 4h

inhibit_rules:
  - source_match:
      alertname: PowerScaleClusterDown
    target_match_re:
      alertname: PowerScale.*
    equal: ['cluster_name']
  
  - source_match:
      alertname: PowerScaleNodeDown
    target_match_re:
      alertname: PowerScale(Disk|Network|Memory|CPU).*
    equal: ['cluster_name', 'node_id']
  
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['cluster_name', 'node_id']

receivers:
- name: 'default-alerts'
  slack_configs:
  - channel: '#powerscale-alerts'
    title: 'PowerScale: {{ .GroupLabels.alertname }}'
    text: |
      *Cluster:* {{ .GroupLabels.cluster_name }}
      *Severity:* {{ .GroupLabels.severity }}
      
      {{ range .Alerts }}
      *Alert:* {{ .Annotations.summary }}
      *Description:* {{ .Annotations.description }}
      {{ end }}
    send_resolved: true

- name: 'critical-alerts'
  slack_configs:
  - channel: '#powerscale-critical'
    title: 'CRITICAL: {{ .GroupLabels.alertname }}'
    text: |
      *Cluster:* {{ .GroupLabels.cluster_name }}
      *Severity:* {{ .GroupLabels.severity }}
      
      {{ range .Alerts }}
      *Alert:* {{ .Annotations.summary }}
      *Description:* {{ .Annotations.description }}
      *Runbook:* {{ .Annotations.runbook_url }}
      {{ end }}
    send_resolved: true

- name: 'warning-alerts'
  slack_configs:
  - channel: '#powerscale-warnings'
    title: 'WARNING: {{ .GroupLabels.alertname }}'
    text: |
      *Cluster:* {{ .GroupLabels.cluster_name }}
      *Severity:* {{ .GroupLabels.severity }}
      
      {{ range .Alerts }}
      *Alert:* {{ .Annotations.summary }}
      *Description:* {{ .Annotations.description }}
      {{ end }}
    send_resolved: true
