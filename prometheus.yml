global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - "alert-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: "isilon-exporter"
    static_configs:
      - targets: ["isilon-exporter:8000"]
    metrics_path: /metrics/
    scrape_interval: 30s
    scrape_timeout: 25s

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
